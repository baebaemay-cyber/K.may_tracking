<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<title>K. may Tracking · เช็คเลขพัสดุ</title>
<style>
:root{
  --bg:#eef4fb;--card:#ffffff;--ink:#16243a;--muted:#5b6b82;--line:#d5e2f1;
  --accent:#98B9DD;--accent-ink:#12283f;--accent-soft:#e3eef9;--accent-text:#2c5a8c;
  --danger:#b42318;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1826;--card:#16212f;--ink:#e8eff8;--muted:#93a3b8;--line:#26364a;
    --accent:#98B9DD;--accent-ink:#0d1f33;--accent-soft:#1a2d44;--accent-text:#98B9DD;
    --danger:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1826;--card:#16212f;--ink:#e8eff8;--muted:#93a3b8;--line:#26364a;
  --accent:#98B9DD;--accent-ink:#0d1f33;--accent-soft:#1a2d44;--accent-text:#98B9DD;
  --danger:#ff8a80;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Sarabun','Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.6;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 72px}
header{text-align:center;margin-bottom:22px}
.badge{width:56px;height:56px;border-radius:16px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px}
h1{font-size:1.6rem;margin:0 0 4px;line-height:1.3}
.sub{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:block;font-weight:500;margin-bottom:6px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:.875rem}
a.btn{text-decoration:none;display:inline-block}
.hint{color:var(--muted);font-size:.875rem;margin:8px 0 0}
#results{margin-top:18px;display:grid;gap:12px}
.res-title{font-weight:700;margin:4px 2px 0}
.parcel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.chip{display:inline-block;font-size:.8rem;font-weight:500;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:2px 10px}
.trk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;font-weight:700;letter-spacing:.02em;margin:8px 0 4px;word-break:break-all}
.note{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.info{background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.info b{display:block;margin-bottom:4px;color:var(--accent-text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">📦</div>
    <h1 id="shop">K. may Tracking</h1>
    <p class="sub">กรอกชื่อแอคที่ใช้สั่งของ เพื่อดูเลขพัสดุของคุณ</p>
  </header>
  <section class="card">
    <label for="q">ชื่อแอคของคุณ</label>
    <div class="row">
      <input id="q" type="text" placeholder="เช่น สมชาย ใจดี หรือ @somchai" autocomplete="off">
      <button id="go" class="btn primary" type="button">ค้นหา</button>
    </div>
    <p class="hint">พิมพ์ให้ตรงกับชื่อที่ใช้สั่งซื้อ (ไม่สนตัวพิมพ์เล็ก-ใหญ่ และช่องว่าง)</p>
  </section>
  <section id="results" aria-live="polite"></section>
</div>

<script>
(function () {
  'use strict';

  /* ===== ตั้งค่า (แก้ตรงนี้) ===================================== */
  var SHOP_NAME = 'K. may Tracking';

  // วางลิงก์ Google Sheets ที่เผยแพร่เป็น CSV ไว้ในเครื่องหมายคำพูดข้างล่าง
  // เช่น 'https://docs.google.com/spreadsheets/d/e/2PACX-xxxx/pub?output=csv'
  // ถ้าเว้นว่างไว้ เว็บจะอ่านข้อมูลจากไฟล์ data.csv แทน
  var SHEET_CSV_URL = '';

  var LOCAL_CSV = 'data.csv';
  /* ============================================================== */

  var CARRIERS = [
    { name: 'Kerry Express', url: 'https://th.kerryexpress.com/th/track', kw: ['kerry', 'เคอรี่'] },
    { name: 'Flash Express', url: 'https://www.flashexpress.co.th/fle/tracking', kw: ['flash', 'แฟลช'] },
    { name: 'J&T Express', url: 'https://jtexpress.co.th', kw: ['j&t', 'jt', 'เจแอนด์ที'] },
    { name: 'Shopee Express (SPX)', url: 'https://spx.co.th', kw: ['spx', 'shopee', 'ช้อปปี้'] },
    { name: 'ไปรษณีย์ไทย / EMS', url: 'https://www.thailandpost.co.th', kw: ['ไปรษณีย์', 'thailandpost', 'thaipost', 'ems', 'ปณ'] },
    { name: 'Best Express', url: 'https://www.best-inc.co.th/track', kw: ['best', 'เบสท์', 'เบสต์'] }
  ];

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  function norm(s) {
    return String(s == null ? '' : s).normalize('NFKC').trim().replace(/^@+/, '').replace(/\s+/g, '').toLowerCase();
  }
  function matchCarrier(text) {
    var t = String(text || '').toLowerCase().replace(/\s+/g, '');
    if (!t) return null;
    var i, k;
    for (i = 0; i < CARRIERS.length; i++) {
      if (CARRIERS[i].name.toLowerCase().replace(/\s+/g, '') === t) return CARRIERS[i];
    }
    for (i = 0; i < CARRIERS.length; i++) {
      for (k = 0; k < CARRIERS[i].kw.length; k++) {
        if (t.indexOf(CARRIERS[i].kw[k]) !== -1) return CARRIERS[i];
      }
    }
    return null;
  }

  /* ---------- อ่านข้อมูล CSV ---------- */
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    var rows = [], row = [], cur = '', inq = false, i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text.charAt(i);
      if (inq) {
        if (ch === '"') {
          if (text.charAt(i + 1) === '"') { cur += '"'; i++; } else { inq = false; }
        } else { cur += ch; }
      } else if (ch === '"') { inq = true; }
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text.charAt(i + 1) === '\n') i++;
        row.push(cur); cur = ''; rows.push(row); row = [];
      } else { cur += ch; }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  function rowsToOrders(rows) {
    var out = [];
    rows.forEach(function (r, idx) {
      var line = r.join(' ');
      if (idx === 0 && /เลขพัสดุ|tracking|ชื่อแอค/i.test(line)) return; // ข้ามหัวตาราง
      var name = (r[0] || '').trim(), carrier = (r[1] || '').trim(), trk = (r[2] || '').trim();
      if (!name || !trk) return;
      var c = matchCarrier(carrier);
      out.push({ name: name, carrier: c ? c.name : carrier, tracking: trk, note: (r[3] || '').trim() });
    });
    return out;
  }

  function fetchText(url) {
    var u = url + (url.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now();
    return fetch(u, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      if (/^\s*</.test(t)) throw new Error('not csv'); // ได้หน้าเว็บกลับมา ไม่ใช่ CSV
      return t;
    });
  }

  var orders = null, loadP = null;
  function ensureData() {
    if (orders) return Promise.resolve(orders);
    if (!loadP) {
      var src = SHEET_CSV_URL
        ? fetchText(SHEET_CSV_URL).catch(function () { return fetchText(LOCAL_CSV); })
        : fetchText(LOCAL_CSV);
      loadP = src.then(function (t) { orders = rowsToOrders(parseCSV(t)); return orders; })
        .catch(function (e) { loadP = null; throw e; });
    }
    return loadP;
  }

  /* ---------- หน้าจอ ---------- */
  function renderHits(hits) {
    var html = '<div class="res-title">พบ ' + hits.length + ' พัสดุ</div>';
    hits.forEach(function (o) {
      var c = matchCarrier(o.carrier);
      html +=
        '<div class="parcel">' +
          '<span class="chip">' + esc(o.carrier || 'ไม่ระบุขนส่ง') + '</span>' +
          '<div class="trk">' + esc(o.tracking) + '</div>' +
          (o.note ? '<p class="note">' + esc(o.note) + '</p>' : '') +
          '<div class="actions">' +
            '<button class="btn sm" type="button" data-copy="' + esc(o.tracking) + '">คัดลอกเลขพัสดุ</button>' +
            (c ? '<a class="btn sm primary" target="_blank" rel="noopener noreferrer" href="' + esc(c.url) + '">เปิดหน้าเช็คของขนส่ง</a>' : '') +
          '</div>' +
        '</div>';
    });
    html += '<p class="hint" style="text-align:center">กด “คัดลอกเลขพัสดุ” แล้วนำไปวางในหน้าเว็บของขนส่งเพื่อดูสถานะล่าสุด</p>';
    return html;
  }

  function doSearch() {
    var nq = norm($('#q').value);
    var box = $('#results');
    if (nq.length < 2) {
      box.innerHTML = '<div class="info"><b>กรุณากรอกชื่อแอคอย่างน้อย 2 ตัวอักษร</b></div>';
      return;
    }
    box.innerHTML = '<div class="info">กำลังค้นหา…</div>';
    ensureData().then(function (list) {
      var hits = list.filter(function (o) { return norm(o.name) === nq; });
      box.innerHTML = hits.length
        ? renderHits(hits)
        : '<div class="info"><b>ระบบกำลังรันเลขพัสดุของท่านเข้าสู่ระบบ</b>โปรดลองอีกครั้งใน 2 - 4 ชั่วโมงหรือภายในวันถัดไป</div>';
    }).catch(function () {
      box.innerHTML = '<div class="info"><b>โหลดข้อมูลไม่สำเร็จ</b>โปรดตรวจสอบอินเทอร์เน็ตแล้วกดค้นหาอีกครั้ง</div>';
    });
  }

  function copyText(t) {
    return new Promise(function (resolve) {
      function fallback() {
        try {
          var ta = document.createElement('textarea');
          ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          var ok = document.execCommand('copy');
          ta.remove(); resolve(ok);
        } catch (e) { resolve(false); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () { resolve(true); }, fallback);
      } else fallback();
    });
  }

  $('#shop').textContent = SHOP_NAME;
  document.title = SHOP_NAME + ' · เช็คเลขพัสดุ';
  $('#go').addEventListener('click', doSearch);
  $('#q').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
  $('#results').addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (!b) return;
    copyText(b.getAttribute('data-copy')).then(function (ok) {
      var old = b.textContent;
      b.textContent = ok ? 'คัดลอกแล้ว ✓' : 'คัดลอกไม่ได้ ลองกดค้างที่เลข';
      setTimeout(function () { b.textContent = old; }, 1600);
    });
  });

  ensureData().catch(function () {}); // โหลดข้อมูลล่วงหน้า
})();
</script>
</body>
</html>
